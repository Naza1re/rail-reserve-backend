name: Run Kotlin Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin

      - name: Configure Docker to use Google Container Registry
        run: |
          gcloud auth configure-docker

      - name: Get Git commit SHA
        id: commit_sha
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build --no-cache -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.IMAGE_NAME }}:${{ env.COMMIT_SHA }} ./train-service

      - name: Push Docker image to Google Container Registry
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.IMAGE_NAME }}:${{ env.COMMIT_SHA }}

      - name: Set up GKE credentials
        run: |
          gcloud container clusters get-credentials rail-reserve-claster \
          --region us-central1 \
          --project rail-reserve-458815

      - name: Apply common Kubernetes resources
        run: |
          kubectl apply -f k8s/common/postgres-deployment.yaml
          kubectl apply -f k8s/common/postgres-service.yaml
          kubectl apply -f k8s/common/configmap.yaml
          kubectl apply -f k8s/common/secret.yaml

      - name: Deploy train-service
        run: |
          kubectl set image deployment/train-service train-service=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
