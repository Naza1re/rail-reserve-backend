apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: gcr.io/rail-reserve-458815/ticket-service:{{COMMIT_SHA}}
          ports:
            - containerPort: 8080
          env:
            - name: DB_RR_URL
              valueFrom:
                configMapKeyRef:
                  name: train-service-config
                  key: DB_RR_URL
            - name: DB_RR_USER
              valueFrom:
                secretKeyRef:
                  name: train-service-secrets
                  key: DB_RR_USER
            - name: DB_RR_PASS
              valueFrom:
                secretKeyRef:
                  name: train-service-secrets
                  key: DB_RR_PASS
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: train-service-config
                  key: SERVER_PORT
